<!--
  LUXURY PRESENCE (and any host that strips <script>) — NO-JAVASCRIPT RESPONSIVE EMBED.
  Paste into a Luxury Presence blog "Embed / Code / HTML" block.

  Why CSS-only: cross-origin auto-height needs JavaScript on the parent page, and
  Luxury Presence sanitizes <script> tags inside blog content. A reflowing page's
  height changes a lot with width (≈17,600px on a phone, ≈11,000px on desktop), so
  the height is stepped by width with media queries. Each step is set slightly tall
  to guarantee no cutoff (the trade-off is a little trailing whitespace).

  The height numbers below are specific to the June 2026 newsletter. If the content
  length changes, RE-MEASURE (see SKILL.md "Generating the no-JS embed") and update.
-->
